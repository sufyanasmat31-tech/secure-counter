# cargo-deny configuration
# Run: cargo deny check
# This goes beyond cargo-audit — it enforces license policy, bans
# duplicate dependency versions, and blocks known-vulnerable crates.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-gnu" },
]

# ── Licence policy ────────────────────────────────────────────────────────────
[licenses]
# Only allow permissive licences — no GPL/AGPL in the dependency tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.93

# ── Dependency bans ───────────────────────────────────────────────────────────
[bans]
# Warn if two different versions of the same crate end up in the graph.
multiple-versions = "warn"
# Deny crates that have been yanked from crates.io.
deny = []

# ── Security advisories ───────────────────────────────────────────────────────
[advisories]
# Pull the RustSec advisory database.
db-urls = ["https://github.com/rustsec/advisory-db"]
# Hard-fail on any crate with a published CVE.
vulnerability = "deny"
# Hard-fail on yanked crates.
yanked = "deny"
# Warn on unmaintained crates — review manually.
unmaintained = "warn"
